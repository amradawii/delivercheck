{% from "partials/status_macros.html" import status_text %}
<div class="rounded-lg border border-zinc-200 p-5" role="alert">
  <div class="flex items-center justify-between gap-4">
    <h2 class="text-base font-semibold text-zinc-950">{{ error_title }}</h2>
    {{ status_text("fail", "Check stopped") }}
  </div>
  <p class="mt-2 text-sm text-zinc-700">{{ error_message }}</p>
  {% if suggested_domain %}
  <div class="mt-3">
    <button
      type="button"
      data-fill-domain="{{ suggested_domain }}"
      class="rounded-lg border border-zinc-300 px-3 py-1.5 text-sm font-medium text-zinc-900 hover:bg-zinc-50"
    >
      Use {{ suggested_domain }}
    </button>
  </div>
  {% endif %}
</div>
