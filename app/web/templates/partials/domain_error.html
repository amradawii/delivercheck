{% from "partials/status_macros.html" import status_text, verdict_icon %}
<div class="dc-card border-l-4 border-l-red-600 p-6 dc-fade-in" role="alert">
  <div class="flex items-start gap-3.5">
    {{ verdict_icon("fail") }}
    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-[18px] leading-snug font-semibold text-slate-900">{{ error_title }}</h2>
        {{ status_text("fail", "Check stopped") }}
      </div>
      <p class="mt-1.5 text-[15px] text-slate-600">{{ error_message }}</p>
      {% if suggested_domain %}
      <div class="mt-4">
        <button
          type="button"
          data-fill-domain="{{ suggested_domain }}"
          class="dc-btn-secondary"
        >
          Use {{ suggested_domain }}
        </button>
      </div>
      {% endif %}
    </div>
  </div>
</div>
