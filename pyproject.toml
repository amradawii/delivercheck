[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delivercheck"
version = "0.1.0"
description = "Check if a domain's email is ready to send and receive, and how to fix it."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.165.0,<1.0.0",
    "uvicorn>=0.54.0,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "python-multipart>=0.0.34,<1.0.0",
    "dnspython>=2.9.0,<3.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "publicsuffixlist>=1.1.0,<2.0.0",
    "aiosmtpd>=1.4.6,<2.0.0",
    "dkimpy[ed25519]>=1.1.8,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.5.0,<2.0.0",
    "httpx2>=2.16.0,<3.0.0",
    "ruff>=0.17.0,<1.0.0",
    "mypy>=2.4.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.checks.*", "app.smtp.*"]
strict = true

[[tool.mypy.overrides]]
module = ["publicsuffixlist", "aiosmtpd", "aiosmtpd.*", "dkim"]
ignore_missing_imports = true
