[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delivercheck"
version = "0.1.0"
description = "Check if a domain's email is ready to send and receive, and how to fix it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn>=0.29.0,<0.30.0",
    "jinja2>=3.1.3,<3.2.0",
    "pydantic>=2.7.0,<2.8.0",
    "python-multipart>=0.0.9,<0.1.0",
    "dnspython>=2.6.1,<2.7.0",
    "cryptography>=42.0.5,<43.0.0",
    "publicsuffixlist>=0.10.0,<1.0.0",
    "aiosmtpd>=1.4.6,<1.5.0",
    "dkimpy[ed25519]>=1.1.6,<1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<8.3.0",
    "pytest-asyncio>=0.23.6,<0.24.0",
    "httpx>=0.27.0,<0.28.0",
    "ruff>=0.4.2,<0.5.0",
    "mypy>=1.10.0,<1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.checks.*", "app.smtp.*"]
strict = true

[[tool.mypy.overrides]]
module = ["publicsuffixlist", "publicsuffixlist.*", "aiosmtpd", "aiosmtpd.*", "dkim", "dkim.*"]
ignore_missing_imports = true
