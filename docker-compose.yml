services:
  unbound:
    build:
      context: ./unbound
    restart: unless-stopped
    networks:
      - delivercheck

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      - unbound
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:8000"
      - "127.0.0.1:2525:2525"
    environment:
      DNS_NAMESERVER: unbound
      DNS_TIMEOUT_SECONDS: "3.0"
      SMTP_INBOX_ENABLED: "true"
      SMTP_INBOX_HOST: "0.0.0.0"
      SMTP_INBOX_PORT: "2525"
      TEST_INBOX_DOMAIN: "test.localhost"
    networks:
      - delivercheck

networks:
  delivercheck:
    driver: bridge
